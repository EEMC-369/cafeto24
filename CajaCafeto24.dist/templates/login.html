<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafeto24 - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .brand-mark {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 5rem;
            height: 5rem;
        }
        .brand-mark__cup {
            position: relative;
            width: 5rem;
            height: 5rem;
        }
        .brand-mark__icon {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4.5rem;
            line-height: 1;
        }
        .brand-mark__text {
            position: absolute;
            top: 50%;
            left: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            letter-spacing: 0.08em;
            line-height: 1;
            white-space: nowrap;
        }
        .brand-mark__text--back {
            color: #8a4b18;
            transform: translate(calc(-50% + 2px), calc(-50% + 1px));
            opacity: 0.95;
        }
        .brand-mark__text--front {
            color: #ffffff;
            transform: translate(-50%, -50%);
            text-shadow: 0 1px 2px rgba(0,0,0,0.45);
        }
    </style>
</head>
<body class="bg-amber-50 h-screen flex items-center justify-center font-sans">

    <div class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-md border border-amber-100">
        <div class="text-center mb-8">
            <div class="brand-mark mx-auto">
                <div class="brand-mark__cup">
                    <span class="brand-mark__icon">☕</span>
                    <span class="brand-mark__text brand-mark__text--back text-[1.15rem]">CAFFETO24</span>
                    <span class="brand-mark__text brand-mark__text--front text-[1.15rem]">CAFFETO24</span>
                </div>
            </div>
            <p class="text-gray-500 mt-1">Control de Caja e Inventario</p>
        </div>

        <!-- Muestra errores si los datos son incorrectos -->
        {% if error %}
        <div class="bg-red-100 border-l-4 border-red-500 text-red-700 p-3 rounded mb-4 text-sm font-semibold">
            {{ error }}
        </div>
        {% endif %}

        <form action="/login" method="POST" class="space-y-6">
            <div>
                <label class="block text-gray-700 font-bold mb-2 text-sm uppercase">Usuario</label>
                <input type="text" name="username" required autocomplete="off"
                       class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500 font-semibold text-lg text-center">
            </div>

            <div>
                <label class="block text-gray-700 font-bold mb-2 text-sm uppercase">Contraseña</label>
                <input type="password" name="password" required
                       class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500 font-semibold text-lg text-center">
            </div>

            <button type="submit" 
                    class="w-full bg-amber-700 hover:bg-amber-800 text-white py-4 rounded-xl font-bold text-lg shadow-md active:scale-95 transition">
                🚀 INGRESAR
            </button>
        </form>

        <!-- Información de Red Local para otros dispositivos -->
        {% if url_acceso_red %}
        <div class="mt-6 pt-4 border-t border-amber-100 text-center">
            <span class="inline-block px-3 py-1 rounded-full bg-amber-50 border border-amber-200 text-amber-900 font-bold text-xs">
                📍 Acceso desde otros dispositivos:
            </span>
            <p class="mt-1.5 text-slate-700 text-sm font-mono font-bold select-all bg-slate-50 p-2 rounded-xl border border-slate-200">
                {{ url_acceso_red }}
            </p>
        </div>
        {% endif %}
    </div>

</body>
</html>
